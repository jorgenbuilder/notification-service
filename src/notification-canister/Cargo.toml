[package]
name = "notification-canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
ic-cdk = "0.13"
ic-cdk-macros = "0.13"
candid = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = { version = "0.21", default-features = false, features = ["alloc"] }
# Pure-Rust crypto crates for future deterministic AES-128-GCM web-push implementation (no OpenSSL)
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes","alloc"] }

[features]
# No features required; keep default empty to avoid bringing in system libraries like OpenSSL
default = []

[dev-dependencies]
pocket-ic = "11"
candid = "0.10"
serde = { version = "1.0", features = ["derive"] }
