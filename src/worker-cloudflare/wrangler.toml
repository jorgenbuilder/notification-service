name = "notification-collector"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Run every minute; adjust as needed
[triggers]
crons = ["*/1 * * * *"]

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[vars]
# Set to local dfx or mainnet IC host
IC_HOST = "https://icp-api.io"
# Set this to your deployed notification_canister canister ID for the chosen network
NOTIFICATION_CANISTER_ID = "zjwxf-jyaaa-aaaao-a43ca-cai"

# Set these via `wrangler secret put ...`:
# - WORKER_ED25519_SECRET_KEY: base64 (Uint8Array) of ed25519 secret key (64 bytes preferred)
